version: 0.9.4
inputs:
  files:
  - workflow/Snakefile
  - workflow/scripts/parse_real_data_metadata.py
  - workflow/scripts/haddnano.py
  - workflow/scripts/Stat_comparison.py
  - workflow/scripts/Plotting.py
  - workflow/scripts/variables.py
  - workflow/scripts/metrics/metrics.py
  - workflow/shell_commands/cleanup_shell.txt
  - workflow/shell_commands/real_data_step_shell.txt
  - workflow/raw_files/DoubleEG.txt
  parameters:
    record_id: 30521
    raw_file_list: "DoubleEG.txt"
    eos_mgm_url: "root://eospublic.cern.ch"
    # Provide the number of RAW files to process (one reco/pat/nano job per
    # file, must not exceed the number of lines in raw_file_list)
    num_files: 1
    # max number of events to process per job/file
    eventsPerJob: 1000
    # eos_dir you want the results to be stored in
    eos_outdir: "/eos/user/a/aalatalo/snakemaketest/data-validation-test"
workflow:
  file: workflow/Snakefile
  type: snakemake

  resources:
    kerberos: True
    cvmfs:
    - cms.cern.ch